name: solo81-foamnest
services:
  desk:
    build:
      context: .
      args:
        FOAMNEST_RUNTIME_IMAGE: ${FOAMNEST_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${FOAMNEST_IMAGE:-solo81-foamnest:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${FOAMNEST_PORT:-19991}:8000"
    volumes:
      - nest-library:/var/lib/foamnest
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/nest/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  nest-library:
